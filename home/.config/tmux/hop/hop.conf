bind-key -T prefix e switch-client -T hop
bind-key -T hop w run-shell -b 'python3 "$HOME/.config/tmux/hop/hop.py" start #{q:pane_id} #{q:client_name} words'
bind-key -T hop / run-shell -b 'python3 "$HOME/.config/tmux/hop/hop.py" start #{q:pane_id} #{q:client_name} pattern'
bind-key -T hop Escape switch-client -T root